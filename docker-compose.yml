services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: tva
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tva -d tva"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://tva:${POSTGRES_PASSWORD:-change-me}@db:5432/tva
      APP_PASSWORD: ${APP_PASSWORD:-}          # vide = pas de mot de passe (usage local uniquement)
      APP_USER: ${APP_USER:-hamza}
      COMPANY_NAME: ${COMPANY_NAME:-CBS TECH MAROC}
      COMPANY_ICE: ${COMPANY_ICE:-002345678000012}
    volumes:
      - uploads:/data
    ports:
      - "8000:8000"

volumes:
  dbdata:
  uploads:
